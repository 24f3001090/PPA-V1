{% extends "layout.html" %}
{% block signin %}
<div class="signin-button-div">
    <a class="nav-button btn btn-outline-primary" href="{{ url_for("profile", st_id = student.s_id)}}">Profile</a>
    <a class="nav-button btn btn-outline-primary" href="{{ url_for("logout")}}">Logout</a>
</div>
{% endblock signin %}
{% block main %}
<div class="dashboard-panel">
    <h2 class="panel-heading">Hello, {{student.name}}</h2>
        <form class="search-div-dashboard" method="POST">
            <input type="text" class="form-control search-input-dashboard" name="demand" placeholder="Search">
            <button class="btn btn-outline-primary nav-button panel-button search-btn-dashboard" type="submit">Search</button>
        <form>
</div>

<div class="page">
    <a class="box-anchor" href=" {{ url_for("st_drives", st_id = student.s_id) }} ">Running Drives</a>
    <a class="box-anchor" href=" {{ url_for("st_com", st_id = student.s_id) }} ">Companies</a>
    <a class=" box-anchor" href="{{ url_for('st_applications', st_id = student.s_id)}}">My Applications</a>
</div>
{% endblock main%}
